<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#09090b">
<title>DEPRICED</title>
<meta name="description" content="Добро пожаловать на новый домен — depriced.live">
<meta property="og:type" content="website">
<meta property="og:title" content="DEPRICED">
<meta property="og:description" content="Добро пожаловать на новый домен">
<meta property="og:image" content="/assets/images/profile.png">
<link rel="icon" href="/assets/images/profile.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;500;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #09090b;
    --card: #111114;
    --border: rgba(255, 255, 255, .08);
    --text: #fafafa;
    --muted: #a1a1aa;
    color-scheme: dark;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background:
      radial-gradient(60% 40% at 50% 0%, rgba(255, 255, 255, .06), transparent 70%),
      var(--bg);
    color: var(--text);
    font-family: "Unbounded", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: grid;
    place-items: center;
    padding: calc(24px + env(safe-area-inset-top, 0px)) 20px calc(24px + env(safe-area-inset-bottom, 0px));
    -webkit-font-smoothing: antialiased;
  }
  .card {
    width: 100%;
    max-width: 420px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 40px 28px 32px;
    text-align: center;
  }
  .avatar {
    width: 112px;
    height: 112px;
    margin: 0 auto 24px;
    border-radius: 50%;
    border: 1px solid var(--border);
    padding: 4px;
    background: var(--bg);
    position: relative;
  }
  .avatar::before {
    content: "";
    position: absolute;
    inset: -4px;
    border-radius: 50%;
    background: conic-gradient(from 0deg, #a78bfa 0 15%, transparent 15% 100%);
    -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 2px), #000 calc(100% - 2px));
    mask: radial-gradient(farthest-side, transparent calc(100% - 2px), #000 calc(100% - 2px));
    z-index: 1;
    animation: spin 3s linear infinite;
  }
  .avatar::after {
    content: "";
    position: absolute;
    inset: -4px;
    border-radius: 50%;
    border: 2px solid rgba(167, 139, 250, .18);
    z-index: 0;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .avatar img, .avatar .fallback {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    object-fit: cover;
    display: block;
  }
  .avatar .fallback {
    display: none;
    place-items: center;
    background: #1c1c21;
    font-size: 40px;
    font-weight: 800;
  }
  .avatar.no-img img { display: none; }
  .avatar.no-img .fallback { display: grid; }
  h1 {
    width: fit-content;
    margin: 0 auto;
    color: #c4b5fd;
    background: linear-gradient(90deg, #fafafa, #c4b5fd);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    font-size: 30px;
    font-weight: 800;
    letter-spacing: .01em;
    line-height: 1.1;
  }
  p {
    width: fit-content;
    margin: 12px auto 0;
    color: #c4b5fd;
    background: linear-gradient(90deg, #fafafa, #c4b5fd);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    font-size: 14px;
    line-height: 1.6;
  }
  .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-top: 28px;
    min-height: 52px;
    padding: 0 24px;
    border-radius: 14px;
    background: var(--text);
    color: var(--bg);
    font-weight: 500;
    font-size: 14px;
    text-decoration: none;
    transition: background-color .15s ease, transform .15s ease;
  }
  .btn:hover { background: #e4e4e7; }
  .btn:active { transform: scale(.98); }
  .btn:focus-visible { outline: 2px solid var(--text); outline-offset: 3px; }
  footer {
    margin-top: 24px;
    color: #52525b;
    font-size: 11px;
  }
  @media (prefers-reduced-motion: reduce) {
    .btn { transition: none; }
    .avatar::before { animation: none; }
  }
</style>
</head>
<body>
  <main class="card">
    <div class="avatar" id="avatar">
      <img src="/assets/images/profile.png" alt="DEPRICED" onerror="document.getElementById('avatar').classList.add('no-img')">
      <div class="fallback" aria-hidden="true">D</div>
    </div>
    <h1>DEPRICED</h1>
    <p>Добро пожаловать на новый домен</p>
    <a class="btn" href="https://depriced.live">depriced.live <span aria-hidden="true">↗</span></a>
    <footer>© 2026 DEPRICED</footer>
  </main>
</body>
</html>
